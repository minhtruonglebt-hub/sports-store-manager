spring.application.name=sports-store-manager
server.port=${PORT:8081}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${SPORTSTORE_DB_URL:jdbc:mariadb://localhost:3306/sportiva?useUnicode=true&characterEncoding=utf8}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${SPORTSTORE_DB_USERNAME:root}
spring.datasource.password=${SPORTSTORE_DB_PASSWORD:}
sportstore.upload-dir=${SPORTSTORE_UPLOAD_DIR:uploads/products}
sportstore.payment.bank-name=${SPORTSTORE_BANK_NAME:}
sportstore.payment.bank-account-number=${SPORTSTORE_BANK_ACCOUNT_NUMBER:}
sportstore.payment.bank-account-holder=${SPORTSTORE_BANK_ACCOUNT_HOLDER:}
sportstore.bootstrap-admin-username=${SPORTSTORE_BOOTSTRAP_ADMIN_USERNAME:admin}
sportstore.bootstrap-admin-password=${SPORTSTORE_BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
sportstore.bootstrap-staff-username=${SPORTSTORE_BOOTSTRAP_STAFF_USERNAME:staff}
sportstore.bootstrap-staff-password=${SPORTSTORE_BOOTSTRAP_STAFF_PASSWORD:Staff@123}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.error.include-stacktrace=never
server.error.include-exception=false
