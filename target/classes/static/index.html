<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sportiva | Quản lý cửa hàng</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--green:#176b4d;--lime:#d9f36a;--ink:#172821;--muted:#7b8981;--line:#e7ece8;--bg:#f6f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 31px;font:800 17px Manrope}.logo{width:36px;height:36px;border-radius:12px;background:var(--green);color:var(--lime);display:grid;place-items:center}.label{padding:9px 12px;color:#9aa59f;font-size:10px;letter-spacing:1.2px;font-weight:700}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#63726a;text-align:left;padding:12px;border-radius:10px;font-weight:600;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#e8f4ed;color:var(--green)}.ico{width:20px;text-align:center;font-size:17px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:17px 10px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8edf7;color:#566684;font-weight:700}.profile b{display:block;font-size:12px}.profile small{color:var(--muted)}main{min-width:0}.top{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 35px}.muted{color:var(--muted)}.status{background:#edf7ef;color:#34804f;padding:7px 11px;border-radius:22px;font-size:11px;font-weight:700}.content{max-width:1400px;margin:auto;padding:32px 35px 55px}.hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.3px;font-weight:800}.hero h1{font:800 29px Manrope;margin:7px 0 5px;letter-spacing:-.7px}.hero p{margin:0;color:var(--muted)}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700}.primary{background:var(--green);color:white}.primary:hover{background:#10573d}.light{background:#f0f4f1;color:#485950}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px}.stat{padding:17px 19px}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{background:#eef6ee;border-radius:9px;width:32px;height:32px;display:grid;place-items:center}.stat strong{font:800 25px Manrope;display:block;margin-top:13px}.stat small{color:#89968f}.panel{overflow:hidden}.panel-head{padding:18px 21px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.panel-head h2{font:700 16px Manrope;margin:0}.tools{display:flex;gap:9px}.search,.filter{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;outline:none}.search{width:230px}.search:focus,input:focus,select:focus,textarea:focus{border-color:#75a68b;box-shadow:0 0 0 3px #e8f4ed}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:12px 18px;background:#fbfcfb;color:#849089;font-size:10px;text-transform:uppercase;letter-spacing:.7px}td{padding:13px 18px;border-top:1px solid #f0f3f0;font-size:13px}tbody tr:hover{background:#fcfdfc}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf7ef;color:#398253;font-size:10px;font-weight:700}.warn{background:#fff5df;color:#ae7823}.gray{background:#f0f2f0;color:#64716a}.product{display:flex;align-items:center;gap:10px}.shoe{height:36px;width:36px;border-radius:9px;background:#eef2ef;display:grid;place-items:center;font-size:18px}.product b{display:block}.product small{color:#89958e}.actions{display:flex;gap:6px}.icon{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:white;color:#68766e}.icon:hover{background:#f2f6f3}.empty{padding:42px;text-align:center;color:var(--muted)}.pagination{padding:13px 19px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.overlay{position:fixed;inset:0;background:#10231d66;display:none;place-items:center;padding:18px;z-index:4}.overlay.show{display:grid}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:white;border-radius:15px;padding:23px;box-shadow:0 22px 60px #14251f30}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal h2{font:800 19px Manrope;margin:0}.close{border:0;background:#f0f3f0;border-radius:7px;width:32px;height:32px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#5e6c64}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;outline:none}.field textarea{min-height:72px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;right:22px;background:#172d23;color:white;padding:13px 17px;border-radius:9px;display:none;z-index:8}.toast.show{display:block}.menu{display:none;border:0;background:white;font-size:20px}.foot{padding:13px 18px;border-top:1px solid var(--line);font-size:10px;color:#89958e}@media(max-width:850px){.app{grid-template-columns:70px 1fr}.side{padding:20px 8px}.brand{padding:0 8px 28px}.brand-name,.label,.nav-label,.profile-info{display:none}.nav button{justify-content:center;padding:13px}.profile{justify-content:center}.content{padding:25px 20px}.top{padding:0 20px}}@media(max-width:600px){.app{grid-template-columns:1fr}.side{position:fixed;top:0;bottom:0;left:-240px;width:235px;z-index:3;transition:left .2s}.side.open{left:0}.brand-name,.label,.nav-label,.profile-info{display:block}.nav button{justify-content:flex-start}.menu{display:block}.top{padding:0 14px;height:60px}.content{padding:21px 12px}.hero{flex-direction:column;align-items:flex-start;gap:13px}.hero h1{font-size:24px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.panel-head{align-items:flex-start;flex-direction:column;gap:11px;padding:15px}.tools{width:100%}.search{width:100%}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><span class="logo">S</span><span class="brand-name">SPORTIVA<span style="color:var(--green)">.</span></span></div><div class="label">QUẢN LÝ</div><nav class="nav" id="nav"></nav><div class="profile"><span class="avatar">AD</span><div class="profile-info"><b>Quản trị viên</b><small>Chủ cửa hàng</small></div></div></aside><main><header class="top"><div style="display:flex;align-items:center;gap:12px"><button class="menu" onclick="side.classList.toggle('open')">☰</button><span class="muted">Cửa hàng　/　</span><b id="crumb">Tổng quan</b></div><span class="status">● Hệ thống hoạt động</span></header><section class="content"><div class="hero"><div><div class="eyebrow">SPORTIVA · QUẢN LÝ CỬA HÀNG</div><h1 id="title">Tổng quan</h1><p id="sub">Theo dõi hoạt động kinh doanh của cửa hàng thể thao.</p></div><button id="add" class="btn primary" onclick="openForm()">＋ Thêm mới</button></div><div id="stats" class="stats"></div><div class="panel"><div class="panel-head"><h2 id="tableTitle">Sản phẩm mới cập nhật</h2><div class="tools"><input class="search" id="search" placeholder="⌕ Tìm kiếm..." oninput="render()"><select class="filter" id="filter" onchange="render()"><option value="all">Tất cả trạng thái</option><option>Đang bán</option><option>Sắp hết</option><option>Ngừng bán</option></select></div></div><div style="overflow:auto"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div class="pagination"><span id="count">0 mục</span><span>Dữ liệu được lưu trong MariaDB (XAMPP)</span></div><div class="foot">SPORTIVA ADMIN · SPRING BOOT REST API</div></div></section></main></div><div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" onclick="closeForm()">×</button></div><form id="form"><div class="form-grid" id="fields"></div><div class="modal-actions"><button type="button" class="btn light" onclick="closeForm()">Hủy</button><button class="btn primary">Lưu thông tin</button></div></form></div></div><div id="toast" class="toast"></div><script>
const cfg={categories:{label:'Danh mục',icon:'▦',url:'/api/categories',fields:[['name','Tên danh mục','text'],['description','Mô tả','textarea']],cols:[['name','Tên danh mục'],['description','Mô tả']]},products:{label:'Sản phẩm',icon:'◈',url:'/api/products',fields:[['name','Tên sản phẩm','text'],['categoryId','Mã danh mục','number'],['brand','Thương hiệu','text'],['size','Kích cỡ','text'],['color','Màu sắc','text'],['price','Giá bán (₫)','number'],['quantity','Tồn kho','number'],['status','Trạng thái','status']],cols:[['name','Sản phẩm'],['brand','Thương hiệu'],['size','Kích cỡ'],['price','Giá bán'],['quantity','Tồn kho'],['status','Trạng thái']]},customers:{label:'Khách hàng',icon:'♙',url:'/api/customers',fields:[['fullName','Họ và tên','text'],['phone','Số điện thoại','text'],['email','Email','email'],['address','Địa chỉ','textarea']],cols:[['fullName','Khách hàng'],['phone','Điện thoại'],['email','Email'],['address','Địa chỉ']]},orders:{label:'Đơn hàng',icon:'▤',url:'/api/orders',fields:[['customerId','Mã khách hàng','number'],['orderDate','Ngày đặt','datetime-local'],['status','Trạng thái','orderStatus'],['totalAmount','Tổng tiền (₫)','number'],['shippingAddress','Địa chỉ giao hàng','textarea']],cols:[['id','Mã đơn'],['customerId','Khách hàng'],['orderDate','Ngày đặt'],['status','Trạng thái'],['totalAmount','Tổng tiền']]},details:{label:'Chi tiết đơn',icon:'≡',url:'/api/order-details',fields:[['orderId','Mã đơn hàng','number'],['productId','Mã sản phẩm','number'],['quantity','Số lượng','number'],['unitPrice','Đơn giá (₫)','number'],['subtotal','Thành tiền (₫)','number']],cols:[['id','Mã CT'],['orderId','Mã đơn'],['productId','Sản phẩm'],['quantity','Số lượng'],['unitPrice','Đơn giá'],['subtotal','Thành tiền']]}};let current='dashboard',rows={},editId=null;const keys=Object.keys(cfg);const nav=document.getElementById('nav');keys.forEach(k=>{let b=document.createElement('button');b.innerHTML=`<span class="ico">${cfg[k].icon}</span><span class="nav-label">${cfg[k].label}</span>`;b.onclick=()=>show(k);b.dataset.key=k;nav.appendChild(b)});let b=document.createElement('button');b.innerHTML='<span class="ico">⌂</span><span class="nav-label">Tổng quan</span>';b.onclick=()=>show('dashboard');nav.prepend(b);b.dataset.key='dashboard';
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function extract(x){if(Array.isArray(x))return x;if(x?._embedded){let a=Object.values(x._embedded);return a.flat()}return []}async function load(){for(let k of keys){try{rows[k]=extract(await api(cfg[k].url))}catch(e){rows[k]=[]}}}
function show(k){current=k;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.key===k));side.classList.remove('open');let c=cfg[k];crumb.textContent=k==='dashboard'?'Tổng quan':c.label;title.textContent=k==='dashboard'?'Tổng quan':c.label;sub.textContent=k==='dashboard'?'Theo dõi hoạt động kinh doanh của cửa hàng thể thao.':`Quản lý thông tin ${c.label.toLowerCase()} trong hệ thống.`;add.style.display=k==='dashboard'?'none':'block';tableTitle.textContent=k==='dashboard'?'Sản phẩm mới cập nhật':`Danh sách ${c.label.toLowerCase()}`;filter.style.display=k==='products'?'block':'none';search.value='';refresh()}async function refresh(){await load();if(current==='dashboard')dashboard();else render()}
function dashboard(){stats.innerHTML=[['Sản phẩm',rows.products?.length||0,'◈'],['Đơn hàng',rows.orders?.length||0,'▤'],['Khách hàng',rows.customers?.length||0,'♙'],['Danh mục',rows.categories?.length||0,'▦']].map(a=>`<div class="stat"><div class="stat-head">${a[0]}<span class="stat-icon">${a[2]}</span></div><strong>${a[1]}</strong><small>Đang quản lý</small></div>`).join('');head.innerHTML='<tr><th>Sản phẩm</th><th>Danh mục</th><th>Thương hiệu</th><th>Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th></th></tr>';let list=[...(rows.products||[])].slice(-6).reverse();body.innerHTML=list.length?list.map(p=>`<tr><td><div class="product"><span class="shoe">👟</span><div><b>${esc(p.name)}</b><small>SKU-${String(p.id).padStart(4,'0')}</small></div></div></td><td>${esc((rows.categories||[]).find(c=>c.id===p.categoryId)?.name||'—')}</td><td>${esc(p.brand||'—')}</td><td>${money(p.price)}</td><td>${p.quantity}</td><td>${badge(p.status,p.quantity)}</td><td><button class="icon" onclick="show('products')">↗</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Chưa có sản phẩm. Thêm mặt hàng đầu tiên để bắt đầu.</td></tr>';count.textContent=`${list.length} sản phẩm gần đây`}
function render(){if(current==='dashboard')return;let c=cfg[current],q=search.value.toLocaleLowerCase('vi'),f=filter.value;let arr=(rows[current]||[]).filter(x=>JSON.stringify(x).toLocaleLowerCase('vi').includes(q)&&(current!=='products'||f==='all'||(f==='Sắp hết'?Number(x.quantity)<=10:x.status===f)));head.innerHTML='<tr>'+c.cols.map(x=>`<th>${x[1]}</th>`).join('')+'<th>Thao tác</th></tr>';body.innerHTML=arr.length?arr.map(x=>'<tr>'+c.cols.map(([key])=>`<td>${cell(key,x)}</td>`).join('')+`<td><div class="actions"><button class="icon" onclick="openForm(${x.id})">✎</button><button class="icon" onclick="removeRow(${x.id})">⌫</button></div></td></tr>`).join(''):`<tr><td colspan="${c.cols.length+1}" class="empty">${q?'Không tìm thấy dữ liệu':'Chưa có dữ liệu. Nhấn Thêm mới để bắt đầu.'}</td></tr>`;count.textContent=`Hiển thị ${arr.length} / ${(rows[current]||[]).length} mục`}
function cell(k,x){let v=x[k];if(k==='name'&&current==='products')return `<div class="product"><span class="shoe">👟</span><div><b>${esc(v)}</b><small>SKU-${String(x.id).padStart(4,'0')}</small></div></div>`;if(k==='categoryId')return esc((rows.categories||[]).find(z=>z.id===v)?.name||'#'+(v||'—'));if(k==='customerId')return esc((rows.customers||[]).find(z=>z.id===v)?.fullName||'#'+(v||'—'));if(k==='productId')return esc((rows.products||[]).find(z=>z.id===v)?.name||'#'+(v||'—'));if(['price','totalAmount','unitPrice','subtotal'].includes(k))return money(v);if(k==='status')return badge(v,x.quantity);if(k==='orderDate')return v?new Date(v).toLocaleDateString('vi-VN'):'—';return esc(v??'—')}
function badge(s,q){if(s==='Sắp hết'||(q!=null&&q<=10))return `<span class="badge warn">${esc(s==='Đang bán'?'Sắp hết':s||'Sắp hết')}</span>`;return `<span class="badge ${s==='Ngừng bán'?'gray':''}">${esc(s||'Đang bán')}</span>`}function money(x){return x==null?'—':new Intl.NumberFormat('vi-VN',{style:'currency',currency:'VND',maximumFractionDigits:0}).format(x)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(id){editId=id||null;let c=cfg[current],x=id?(rows[current]||[]).find(a=>a.id===id):{};modalTitle.textContent=(id?'Chỉnh sửa ':'Thêm ')+c.label.toLowerCase();fields.innerHTML=c.fields.map(([k,l,t])=>{let v=x?.[k]??'';if(t==='textarea')return `<div class="field full"><label>${l}</label><textarea name="${k}">${esc(v)}</textarea></div>`;if(t==='status'||t==='orderStatus'){let a=t==='status'?['Đang bán','Sắp hết','Ngừng bán']:['Chờ xác nhận','Đang xử lý','Đang giao','Hoàn thành','Đã hủy'];return `<div class="field"><label>${l}</label><select name="${k}">${a.map(z=>`<option ${v===z?'selected':''}>${z}</option>`).join('')}</select></div>`}return `<div class="field"><label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}" ${t==='number'?'min="0" step="any"':''}></div>`}).join('');overlay.classList.add('show')}
function closeForm(){overlay.classList.remove('show')}function notify(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',2600)}form.onsubmit=async e=>{e.preventDefault();let c=cfg[current],obj=Object.fromEntries(new FormData(form).entries());c.fields.forEach(([k,l,t])=>{if(t==='number')obj[k]=obj[k]===''?null:Number(obj[k])});if(current==='orders'&&!obj.orderDate)obj.orderDate=new Date().toISOString().slice(0,19);try{await api(c.url+(editId?'/'+editId:''),{method:editId?'PUT':'POST',body:JSON.stringify(obj)});closeForm();notify(editId?'Đã cập nhật dữ liệu':'Đã thêm dữ liệu');refresh()}catch(e){notify('Không lưu được. Kiểm tra thông tin nhập.')}};async function removeRow(id){if(!confirm('Bạn muốn xóa dữ liệu này?'))return;try{await api(cfg[current].url+'/'+id,{method:'DELETE'});notify('Đã xóa dữ liệu');refresh()}catch(e){notify('Không thể xóa dữ liệu')}}show('dashboard');
</script><script src="/features.js" defer></script></body></html>
